# Testes do simulador em cada pull request e em cada push na main.
# Falha se algum teste falhar ou se a cobertura ficar abaixo de 90%.
# O firmware (C++) roda no ESP32 e e testado na placa (ver TESTES.md).
name: Testes do simulador

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias
        run: pip install -r simulador/requirements.txt -r requirements-dev.txt

      - name: Analise estatica (ruff)
        run: ruff check --output-format=github .

      # Inclui um broker MQTT local (amqtt): nao usa o HiveMQ nem precisa de senha.
      - name: Testes e cobertura
        run: >
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
          --junitxml=relatorio-testes.xml

      - name: Resumo por tipo de teste
        if: always()
        run: python .github/resumo_testes.py relatorio-testes.xml coverage.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Evidencias (relatorio de cobertura e resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes-simulador
          path: |
            htmlcov/
            relatorio-testes.xml
            coverage.xml
