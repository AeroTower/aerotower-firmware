[pytest]
testpaths = simulador/tests
addopts = -ra
markers =
    unitario: um componente isolado (funcao ou classe), com dubles no lugar do resto
    integracao: simulador + broker MQTT de verdade (local)
    funcional: o simulador pela linha de comando, como na demonstracao
    aceitacao: criterios de aceite das historias de usuario (BDD, arquivos .feature)
    desempenho: carga e resistencia
    seguranca: comandos maliciosos e configuracao segura
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
